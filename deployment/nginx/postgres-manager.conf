server {
    listen 8080;
    server_name _;
    root /home/pi/Database/postgres-manager/app/frontend/dist;
    index index.html;
    add_header X-Frame-Options DENY; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy same-origin;

    location / { try_files $uri /index.html; }
    location /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /home/pi/Database/postgres-manager/app/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 1800;
    }
    location ~ /\.(?!well-known) { deny all; }
}
